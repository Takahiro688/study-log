<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>study-log | 学習記録</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1 class="title">study-log</h1>
      <p class="lead">毎日の学習時間を記録して、続いているかをひと目で確認できます。</p>
    </header>

    <section class="streak" aria-labelledby="streak-heading">
      <div class="streak-head">
        <h2 id="streak-heading">直近14日</h2>
        <p class="streak-total">合計 <strong id="total-minutes">0</strong> 分</p>
      </div>
      <ol id="day-grid" class="day-grid"></ol>
    </section>

    <section aria-labelledby="form-heading">
      <h2 id="form-heading">記録を追加</h2>
      <form id="record-form" class="record-form" novalidate>
        <label>
          日付
          <input type="date" name="date" required>
        </label>
        <label>
          学習した内容
          <input type="text" name="topic" maxlength="100" placeholder="例：JavaScriptの配列メソッド" required>
        </label>
        <label>
          学習時間（分）
          <input type="number" name="minutes" min="1" max="1440" step="1" required>
        </label>
        <p id="form-error" class="form-error" role="alert"></p>
        <button type="submit">記録する</button>
      </form>
    </section>

    <section aria-labelledby="list-heading">
      <h2 id="list-heading">これまでの記録</h2>
      <p id="empty-message" class="empty">まだ記録がありません。今日の学習から追加してみましょう。</p>
      <ul id="record-list" class="record-list"></ul>
    </section>
  </main>

  <!-- storage.js → app.js の順で読み込む（app.js が StudyStorage を使うため） -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
